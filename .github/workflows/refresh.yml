name: Refresh VHIS workbook

# Runs itself. Your uncle does nothing.
#
# Weekly on Monday 07:00 Hong Kong time (23:00 UTC Sunday). Checks data.gov.hk,
# and if nothing changed it stops after four HTTP requests and costs you nothing.
# If something changed it rebuilds the workbook, scrapes ONLY the plan PDFs whose
# plan_date actually moved, and publishes a new file at a permanent URL.

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:        # lets you force a run from the Actions tab
    inputs:
      force_full_scrape:
        description: "Re-scrape all 579 plan PDFs (slow, ~40 min)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils libreoffice-calc
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 1. Has anything actually changed?
      #
      # refresh.py --check is read-only: it does not touch vhis_state.db, so
      # the --pull below still sees the change and produces a real diff.
      #
      # Exit codes: 0 no change, 1 changed, 2 a download failed. Code 2 must
      # fail the job. Treating it as "no change" would let the workflow go
      # green forever while publishing increasingly stale data.
      # ------------------------------------------------------------------
      - name: Check data.gov.hk
        id: check
        run: |
          set +e
          python refresh.py --check
          rc=$?
          set -e
          case $rc in
            0) echo "changed=false" >> $GITHUB_OUTPUT; echo "No upstream changes." ;;
            1) echo "changed=true"  >> $GITHUB_OUTPUT; echo "Upstream data changed." ;;
            *) echo "refresh.py --check failed with exit $rc"; exit $rc ;;
          esac

      # pipefail so a failing refresh.py is not masked by tee's exit status.
      - name: Pull and diff
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        shell: bash
        run: |
          set -o pipefail
          python refresh.py --pull | tee change_report.txt

      # ------------------------------------------------------------------
      # 2. Rebuild the flat data
      # ------------------------------------------------------------------
      - name: Build catalog
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        run: python build_vhis.py --data-dir current --out-dir out

      # ------------------------------------------------------------------
      # 3. Scrape ONLY what needs scraping
      #
      # Benefit terms change on recertification, not on a premium revision.
      # data/plan_benefits.csv is keyed on cert + plan_date, so a routine
      # premium update re-scrapes nothing.
      # ------------------------------------------------------------------
      - name: Determine scrape targets
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        id: targets
        run: |
          if [ "${{ inputs.force_full_scrape }}" = "true" ]; then
            echo "ALL" > scrape_targets.txt
          else
            python - <<'EOF'
          import csv, os
          have = {}
          if os.path.exists("data/plan_benefits.csv"):
              for r in csv.DictReader(open("data/plan_benefits.csv", encoding="utf-8-sig")):
                  have[r["certification_no"]] = r.get("plan_date", "")
          need = []
          for r in csv.DictReader(open("out/plans_catalog.csv", encoding="utf-8-sig")):
              cert, pd = r["certification_no"], r["plan_date"]
              if cert not in have or have[cert] != pd:
                  need.append(cert)
          open("scrape_targets.txt", "w").write(",".join(need))
          print(f"{len(need)} variant(s) need a PDF scrape")
          EOF
          fi
          echo "count=$(tr ',' '\n' < scrape_targets.txt | grep -c . || true)" >> $GITHUB_OUTPUT

      # The guard on `changed` is not redundant. Without it, a no-change run
      # skips the targets step, leaves steps.targets.outputs.count as the empty
      # string, and '' != '0' is true - so the scraper ran on every quiet week,
      # crashed on the missing catalog, and was hidden by continue-on-error.
      - name: Scrape plan PDFs
        if: >-
          (steps.check.outputs.changed == 'true' || inputs.force_full_scrape)
          && steps.targets.outputs.count != '0'
        continue-on-error: true    # a bad PDF must not block the premium refresh
        run: |
          TARGETS=$(cat scrape_targets.txt)
          if [ "$TARGETS" = "ALL" ]; then
            python scrape_plans.py --catalog out/plans_catalog.csv \
              --cache pdf_cache --out data/plan_benefits.csv \
              --review data/review_queue.csv --sleep 1.5
          else
            python scrape_plans.py --catalog out/plans_catalog.csv \
              --only "$TARGETS" --cache pdf_cache \
              --out data/plan_benefits_new.csv \
              --review data/review_queue.csv --sleep 1.5
            python - <<'EOF'
          import csv, os
          base, old_fields = {}, []
          if os.path.exists("data/plan_benefits.csv"):
              rd = csv.DictReader(open("data/plan_benefits.csv", encoding="utf-8-sig"))
              base = {r["certification_no"]: r for r in rd}
              old_fields = list(rd.fieldnames or [])
          new = list(csv.DictReader(open("data/plan_benefits_new.csv", encoding="utf-8-sig")))
          new_fields = list(new[0].keys()) if new else []
          # Union, new columns first. Taking the OLD header verbatim would drop
          # any column added since the last run - including plan_date, whose
          # absence silently forces a full 579-PDF re-scrape every week.
          fields = new_fields + [f for f in old_fields if f not in new_fields]
          if not fields:
              raise SystemExit("no columns to write; refusing to truncate the file")
          for r in new:
              base[r["certification_no"]] = r
          with open("data/plan_benefits.csv", "w", newline="", encoding="utf-8-sig") as f:
              w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
              w.writeheader(); w.writerows(base.values())
          print(f"merged {len(new)} scraped row(s); {len(base)} total")
          EOF
          fi

      # ------------------------------------------------------------------
      # 4. Rebuild the workbook and prove the formulas evaluate
      # ------------------------------------------------------------------
      - name: Build workbook
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        run: |
          python make_workbook.py --data-dir current --out VHIS_Compare.xlsx \
            --benefits data/plan_benefits.csv --overrides data/manual_overrides.csv

      - name: Verify no formula errors
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        run: |
          python verify_workbook.py VHIS_Compare.xlsx --timeout 400 --json | tee recalc.json
          python - <<'EOF'
          import json, sys
          r = json.load(open("recalc.json"))
          if r.get("status") != "success" or r.get("total_errors", 1) != 0:
              print("FORMULA ERRORS, refusing to publish:", r)
              sys.exit(1)
          print(f"OK: {r['total_formulas']} formulas, 0 errors")
          EOF

      # ------------------------------------------------------------------
      # 5. Publish. The download URL never changes, so he can bookmark it.
      # ------------------------------------------------------------------
      # git add aborts on the FIRST pathspec that matches nothing and stages
      # nothing at all. `snapshots` never existed, so this used to be a silent
      # no-op: vhis_state.db and data/plan_benefits.csv were never committed,
      # every run then saw all four files as NEW, and the full 40-minute PDF
      # scrape repeated weekly forever. Add each path only if it exists, and
      # let the push fail loudly rather than `|| true`.
      - name: Commit
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        run: |
          git config user.name  "vhis-bot"
          git config user.email "vhis-bot@users.noreply.github.com"
          for p in data VHIS_Compare.xlsx vhis_state.db; do
            if [ -e "$p" ]; then
              git add -A "$p"
            else
              echo "skipping $p (not present)"
            fi
          done
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing staged; leaving the repo untouched."
          else
            git commit -m "Refresh $(date +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Publish release
        if: steps.check.outputs.changed == 'true' || inputs.force_full_scrape
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VHIS Compare (latest)"
          body_path: change_report.txt
          files: VHIS_Compare.xlsx
          make_latest: true
